<!-- ROW 1: фото слева, интро+история справа -->
<div class="story--row story--row-greating uk-grid-large uk-child-width-1-1 uk-child-width-1-2@m" uk-grid uk-height-match="target: .story-card">
  <div class="story--col story--col-quote">
    <div class="story-card story-card--quote bubble">
      <img class="bubble--image bubble--image-left uk-visible@m" src="./assets/images/global/story/buuble.png" alt="bubble image" loading="lazy">
      <p class="story-quote story-quote--intro">@@intro</p>
      @@if (typeof history !== 'undefined' && history) {<p class="story-quote story-quote--intro">@@history</p>}
    </div>
  </div>
  <div class="story--col story--col-photo">
    <img class="story--brush" src="./assets/images/global/story/story-zigzag.svg" alt="story--brush" loading="lazy">
    <img class="story--photo" src="@@img1" alt="@@alt1" loading="lazy">
  </div>
</div>

<div class="story--row story--row-process uk-grid-large uk-child-width-1-1 uk-child-width-1-2@m" uk-grid uk-height-match="target: .story-card">
  <div class="story--col story--col-quote">
    <div class="story-card story-card--quote bubble">
      <img class="bubble--image bubble--image-right uk-visible@m" src="./assets/images/global/story/buuble-right.png" alt="bubble image" loading="lazy">
      @@if (typeof processTitle !== 'undefined' && processTitle) {<p class="story-quote story-quote--intro">@@processTitle</p>}
      <p class="story-quote">@@process</p>
    </div>
  </div>
  <div class="story--col story--col-photo">
    <img class="story--photo" src="@@img2" alt="@@alt2" loading="lazy">
  </div>
</div>

<div class="story--row story--row-result uk-grid-large uk-child-width-1-1 uk-child-width-1-2@m" uk-grid uk-height-match="target: .story-card">
  <div class="story--col story--col-quote">
    <div class="story-card story-card--quote bubble">
      <img class="bubble--image bubble--image-left uk-visible@m" src="./assets/images/global/story/buuble.png" alt="bubble image" loading="lazy">
      @@if (typeof resultTitle !== 'undefined' && resultTitle) {<p class="story-quote story-quote--intro">@@resultTitle</p>}
      <p class="story-quote">@@result</p>
    </div>
  </div>
  <div class="story--col story--col-photo">
    <img class="story--photo" src="@@img3" alt="@@alt3" loading="lazy">
  </div>
</div>

<div class="uk-text-center uk-margin-large-top">
  <a class="story--bttn uc--bttn uc--bttn-story uk-button uk-button-primary uk-border-pill" href="#cta" target="_blank" rel="noopener">Узнать условия пребывания в&nbsp;пансионате</a>
</div>
